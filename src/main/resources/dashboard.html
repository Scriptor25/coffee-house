<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
</head>
<body>

<form id="login-form" style="display: none">
    <label>
        <span hidden>username</span>
        <input type="text" name="username" placeholder="username" required/>
    </label>
    <label>
        <span hidden>password</span>
        <input type="password" name="password" placeholder="password" required/>
    </label>
    <button type="submit">login</button>
</form>

<ul id="media-list" style="display: none"></ul>

<script type="text/javascript">
    /**
     * @typedef {{ id: string, path: string, title: string }} Media
     */

    class FileNode {
        /**
         * @param {string} name
         */
        constructor(name) {
            this.name = name
        }
    }

    class DirectoryNode extends FileNode {

        /**
         * @param {string} name
         * @param {FileNode[]} children
         */
        constructor(name, children) {
            super(name)
            this.children = children
        }
    }

    class MediaNode extends FileNode {
        /**
         * @param {Media} item
         */
        constructor(item) {
            super(item.title)
            this.item = item
        }
    }

    /**
     * @param {string} str
     * @returns {string[]}
     */
    function segments(str) {
        return str.split("/").filter(item => !!item)
    }

    /**
     * @param {string} path
     * @returns {string[]}
     */
    function normalize(path) {
        const stack = []

        for (const segment of segments(path)) {
            if (segment === "..") {
                if (stack.length) stack.pop()
            } else {
                stack.push(segment)
            }
        }

        return stack
    }

    /**
     * @param {string} from
     * @param {string} to
     * @returns {string}
     */
    function relative(from, to) {
        const a = normalize(from)
        const b = normalize(to)

        let i = 0
        for (; i < a.length && i < b.length && a[i] === b[i]; ++i) {
        }

        /**
         * @type {string[]}
         */
        const result = [
            ...Array(a.length - i).fill(".."),
            ...b.slice(i),
        ]

        const absolute = a.length === i

        return result.length ? ((absolute ? "/" : "") + result.join("/")) : (absolute ? "/" : ".")
    }

    /**
     * @param {Media[]} items
     * @returns {string}
     */
    function getCommonBase(items) {
        const directories = items.map(item => segments(item.path))

        const common = []

        for (let i = 0; ; ++i) {
            const segment = directories[0][i]
            if (segment === undefined) break
            if (!directories.every(item => item[i] === segment)) break
            common.push(segment)
        }

        return "/" + common.join("/")
    }

    /**
     * @param {Media[]} items
     * @param {string} base
     * @returns {DirectoryNode}
     */
    function buildTree(items, base) {
        const tree = new DirectoryNode("", [])

        for (const item of items) {
            let current = tree
            const rel = segments(relative(base, item.path))

            for (let i = 0; i < rel.length - 1; ++i) {
                const name = rel[i]

                let child = current.children
                    .filter((node) => node instanceof DirectoryNode)
                    .find((node) => node.name === name) ?? null

                if (child === null) {
                    child = new DirectoryNode(name, [])
                    current.children.push(child)
                }

                current = child
            }

            current.children.push(new MediaNode(item))
        }

        return tree
    }

    async function render() {
        const session = localStorage.getItem("session")

        const loginForm = document.getElementById("login-form")
        const mediaList = document.getElementById("media-list")

        const endpoint = window.location.origin

        if (session !== null) {
            const response = await fetch(`${endpoint}/media`, {
                method: "GET",
                headers: {
                    "authorization": `Bearer ${session}`,
                },
            })

            if (response.ok) {
                const slug = segments(decodeURI(window.location.pathname))

                /**
                 * @type {Media[]}
                 */
                const items = await response.json()

                const base = getCommonBase(items)

                let node = buildTree(items, base)
                for (const segment of slug) {
                    if (node === null || node.name === segment) break
                    node = node.children
                        .filter(node => node instanceof DirectoryNode)
                        .find(node => node.name === segment) ?? null
                }

                if (node !== null) {
                    const listItems = node.children.toSorted((a, b) => a.name.localeCompare(b.name)).map(node => {
                        const listItem = document.createElement("li")
                        const anchor = document.createElement("a")
                        if (node instanceof MediaNode) {
                            /**
                             * @type {MediaNode} node
                             */
                            anchor.href = encodeURI(`${endpoint}/media/stream/${node.item.id}?token=${session}`)
                        } else {
                            anchor.href = encodeURI(`${endpoint}${slug.length ? "/" + slug.join("/") : ""}/${node.name}`)
                        }
                        anchor.append(node.name)
                        listItem.append(anchor)
                        return listItem
                    })

                    if (slug.length) {
                        const target = slug.slice(0, -1)

                        const listItem = document.createElement("li")
                        const anchor = document.createElement("a")
                        anchor.href = encodeURI(`${endpoint}${target.length ? "/" + target.join("/") : ""}`)
                        anchor.append("..")
                        listItem.append(anchor)
                        listItems.unshift(listItem)
                    }

                    mediaList.append(...listItems)
                }

                loginForm.style.display = "none"
                mediaList.style.display = "block"
            } else if (response.status === 401) {
                localStorage.removeItem("session")

                await render()
            } else {
                console.log(response.status, response.statusText, await response.text())
            }
        } else {
            loginForm.addEventListener("submit", async (event) => {
                event.preventDefault()

                const data = new FormData(event.currentTarget, event.submitter)

                event.currentTarget.reset()

                const response = await fetch(`${endpoint}/session`, {
                    method: "POST",
                    body: JSON.stringify(Object.fromEntries(data)),
                    headers: {
                        "content-type": "application/json",
                    },
                })

                if (response.ok) {
                    const data = await response.json()

                    localStorage.setItem("session", data.token)

                    await render()
                } else {
                    console.log(response.status, response.statusText, await response.text())
                }
            })

            loginForm.style.display = "block"
            mediaList.style.display = "none"
        }
    }

    render()
</script>

</body>
</html>
